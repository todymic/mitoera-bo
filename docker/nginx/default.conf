server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index admin.html;

    # Proxy Mercure SSE vers le hub (nécessaire pour le BO sur mitoera.com)
    location /.well-known/mercure {
        proxy_pass http://mitoera-nginx/.well-known/mercure;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host api.mitoera.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Widget render — proxifié vers l'API (render.html et mitoera-render.js vivent dans public/ de l'API)
    location ~ ^/(render\.html|mitoera-render\.js)$ {
        proxy_pass http://mitoera-nginx;
        proxy_set_header Host api.mitoera.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /api/ vers le backend Symfony (service Docker interne)
    location /api/ {
        proxy_pass http://mitoera-nginx/api/;
        proxy_set_header Host api.mitoera.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback : toutes les routes Vue retombent sur admin.html
    location / {
        try_files $uri $uri/ /admin.html;
    }

    # Assets avec cache long
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
